name: Full-stack E2E

on:
  pull_request:
    paths:
      - "web/**"
      - "api/**"
      - "supabase/**"
      - "e2e/**"
      - ".github/workflows/full-stack-e2e.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "api/**"
      - "supabase/**"
      - "e2e/**"
      - ".github/workflows/full-stack-e2e.yml"

permissions:
  contents: read

jobs:
  browser:
    name: Chromium with isolated local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
            e2e/package-lock.json
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: "2.122.0"
      - name: Install API, frontend and browser dependencies
        run: |
          npm ci --prefix api
          npm ci --prefix web
          npm ci --prefix e2e
          cd e2e
          npx playwright install --with-deps chromium
      - name: Start fresh isolated Supabase
        run: supabase start >/dev/null
      - name: Run full-stack browser tests
        working-directory: e2e
        run: npm test
      - name: Stop isolated Supabase
        if: always()
        run: supabase stop >/dev/null
